<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório de autenticação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5 d-flex justify-content-center">
    <div class="card shadow-sm w-100" style="max-width: 400px;">
      <div class="card-body text-center p-4">
        <h1 class="h4 mb-4">Laboratório de Autenticação</h1>
        
        <p id="status" class="alert alert-secondary">A sessão ainda não foi consultada.</p>
        
        <div class="d-grid gap-3 mb-4">
          <a href="/oauth/login/google" class="btn btn-outline-primary">Entrar com Google</a>
          <a href="/oauth/login/github" class="btn btn-outline-dark">Entrar com GitHub</a>
        </div>
        <form method="post" action="/oauth/logout">
          <button type="submit" class="btn btn-danger w-100">Sair</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
